---
# Main stress test playbook - includes start, wait, and stop operations

- name: Generate a timestamp for the logs directory
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Generate a timestamp for the logs directory
      set_fact:
        logs_path: "./logs/{{ lookup('pipe', 'date -Iseconds') }}"
      run_once: true # Ensures this task runs only once, even with multiple hosts

- name: Resymot Stress Test Playbook
  hosts: stress_test_nodes
  become: true # sudo
  roles:
    - resymot_stress

- name: Start Resymot Stress Test
  hosts: localhost
  vars:
    test_duration_hours: "{{ hostvars[groups['stress_test_nodes'][0]]['stress_duration_hours'] }}"
    unittest_executable: "/home/morgana/resymot/build/Debug/tests/xyz_unittests"
    logs_path: "{{ logs_path }}"
  roles:
    - start_stress_test
  ignore_errors: true

- name: Wait for stress test duration and then stop
  hosts: stress_test_nodes
  run_once: true
  connection: local
  vars:
    test_duration_hours: "{{ stress_duration_hours | default(1) }}"
  tasks:
    - block:
        - name: Display stress test running information
          debug:
            msg: |
              Stress test is now running for {{ test_duration_hours }} hours.

              The following processes are active:
              1. System monitoring (sh -c while true; do date; busybox top -b -n 1; sleep)
              2. Unit tests (xyz_unittests)
              3. Resymot server
              4. CPU stress processes

              Waiting for {{ test_duration_hours }} hours before automatic cleanup...
        - name: Wait for stress test duration to complete
          pause:
            seconds: "{{ (test_duration_hours | float * 3600) | int }}"
        - name: Display cleanup start message
          debug:
            msg: |
              Test duration of {{ test_duration_hours }} hours completed.
              Starting cleanup process...
      when: stress_test_start_success | default(false)

- name: Stop Resymot Stress Test
  hosts: localhost
  vars:
    logs_path: "{{ logs_path }}"
  tasks:
    - name: Stop local monitoring processes
      ansible.builtin.import_role:
        name: stop_stress_test
        tasks_from: stop_local_process.yml

- name: Stop Resymot Stress Test on target nodes
  hosts: stress_test_nodes
  vars:
    logs_path: "{{ logs_path }}"
  become: true
  tasks:
    - name: Stop process
      ansible.builtin.import_role:
        name: stop_stress_test
        tasks_from: stop_nodes_process.yml

- name: Display stop Resymot Stress Test
  hosts: localhost
  vars:
    logs_path: "{{ logs_path }}"
  tasks:
    - name: Stop local monitoring processes
      ansible.builtin.import_role:
        name: stop_stress_test
        tasks_from: final_display.yml
