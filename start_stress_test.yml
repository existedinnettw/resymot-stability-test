---
- name: Resymot Stress Test Playbook
  hosts: stress_test_nodes
  become: yes #sudo
  roles:
    - resymot_stress
    # - { role: resymot_stress, tags: ['setup', 'stress'] }

- name: Start monitoring and unit tests on control node
  hosts: localhost
  connection: local
  vars:
    test_duration_hours: "{{ hostvars[groups['stress_test_nodes'][0]]['stress_duration_hours'] }}"
    unittest_executable: "/home/morgana/resymot/build/Debug/tests/xyz_unittests"

  tasks:
    - name: Init stress_test_start_success to true
      set_fact:
        stress_test_start_success: true
    - name: Create local log directory
      file:
        path: "{{ logs_path }}"
        state: directory
        mode: "0755"

    - block:
        - name: Start system monitoring for each node
          shell: |
            nohup ssh {{ hostvars[item]['ansible_user'] }}@{{ hostvars[item]['ansible_host'] }} "
              while true; do
                date -Iseconds
                echo '=== System ==='
                top -b -n 1 | egrep 'CPU|Cpu|Mem' | grep -v '^[ 0-9]'
                echo '=== resymot.AppImage ==='
                cpu_sum=\$(top -b -n 1 | grep resymot | awk '{sum+=\$9} END {print sum}')
                mem_kb=\$(top -b -n 1 | grep resymot | awk '{sum+=\$6} END {print sum}')
                if [ -z \$cpu_sum ] && [ -z \$mem_kb ]; then
                  echo 'resymot.AppImage not running'
                else
                  mem_mb=\$(echo \"scale=2; \$mem_kb/1024\" | bc)
                  echo \"Total resymot.AppImage CPU: \$cpu_sum %\"
                  echo \"Total resymot.AppImage Memory: \$mem_mb MB\"
                fi
                echo
                sleep {{ hostvars[item]['log_interval_seconds'] }}
              done
            " > {{ logs_path }}/{{ item }}_system_log.txt 2>&1 &
            echo $! > {{ logs_path }}/{{ item }}_monitor.pid
          loop: "{{ groups['stress_test_nodes'] }}"
          async: 0
          poll: 0

        - name: Start Resymot server on target nodes
          shell: |
            ssh {{ hostvars[item]['ansible_user'] }}@{{ hostvars[item]['ansible_host'] }} \
            "sudo sh /tmp/start_resymot.sh > {{ log_dir }}/resymot_startup.log 2>&1 &"
          loop: "{{ groups['stress_test_nodes'] }}"

        - name: Wait for Resymot server to be ready
          uri:
            url: "http://{{ hostvars[groups['stress_test_nodes'][0]]['ansible_host'] }}:{{ hostvars[groups['stress_test_nodes'][0]]['resymot_port'] }}/"
            method: GET
            status_code: [200, 404]
          register: resymot_health
          until: resymot_health is not failed
          retries: 3
          delay: 2
          ignore_errors: no

      rescue:
        - name: Mark setup as failed
          set_fact:
            stress_test_start_success: false
        - name: Log setup failure
          debug:
            msg: "Setup failed, skipping stress test and unit tests."

    - name: Start stress test on target nodes
      shell: |
        ssh {{ hostvars[item]['ansible_user'] }}@{{ hostvars[item]['ansible_host'] }} \
        "nohup {{ stress_script_path }} --duration {{ test_duration_hours }} > {{ log_dir }}/{{ item }}_stress.log 2>&1 &"
      loop: "{{ groups['stress_test_nodes'] }}"
      async: 0
      poll: 0
      when: stress_test_start_success | default(false)

    - name: Run unit tests with custom log path and mach_id 1
      include_tasks: roles/resymot_stress/tasks/run_unittests.yml
      vars:
        # logs_path: "{{ logs_path }}"
        mach_id: 1
      when: stress_test_start_success | default(false)

    - name: Run unit tests with custom log path and mach_id 2
      include_tasks: roles/resymot_stress/tasks/run_unittests.yml
      vars:
        # logs_path: "{{ logs_path }}"
        mach_id: 2
      when: stress_test_start_success | default(false)

    - name: Display stress test startup completed
      debug:
        msg: |
          Stress test startup completed! 

          The Resymot server has been started and unit tests are now running.

          Monitoring logs: {{ logs_path }}/*_system_log.txt
          Unit test logs: {{ logs_path }}/unit_tests.log (running xyz_unittests)
          Resymot startup logs: Check {{ logs_path }}/resymot_startup.log on target nodes

          Process PIDs:
          {% for node in groups['stress_test_nodes'] %}
          - {{ node }} monitoring: {{ logs_path }}/{{ node }}_monitor.pid
          {% endfor %}
          - Unit tests (xyz_unittests): {{ logs_path }}/unit_tests.pid

          Unit test executable: {{ unittest_executable }}
          RESYMOT_URL: http://{{ hostvars[groups['stress_test_nodes'][0]]['ansible_host'] }}:{{ hostvars[groups['stress_test_nodes'][0]]['resymot_port'] }}/

          Active processes:
          1. System monitoring (sh -c while true; do date; top -b -n 1; sleep)
          2. Unit tests (xyz_unittests)
          3. Resymot server

          The stress test is now running and will be managed by the main playbook.
      when: stress_test_start_success | default(false)

    - name: Mark start as successful on all stress_test_nodes
      set_fact:
        stress_test_start_success: true
      delegate_to: "{{ item }}"
      delegate_facts: true
      run_once: true
      loop: "{{ groups['stress_test_nodes'] }}"
      when: stress_test_start_success | default(false)
