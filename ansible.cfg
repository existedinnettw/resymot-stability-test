# Disable module compression for systems without zlib
[defaults]
host_key_checking = False
inventory = production
private_key_file = ~/.ssh/id_rsa
module_compression = 'ZIP_STORED'
gathering = explicit
timeout = 10
roles_path = roles

# Enable connection persistence
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60m -o Compression=no -o ServerAliveInterval=30 -o Ciphers=chacha20-poly1305@openssh.com -o MACs=umac-64-etm@openssh.com
control_path = ~/.ansible/cp/%%h-%%p-%%r
pipelining = True
retries = 1
