# assume ethercat pdo config will not change, even need to change mode.
# all the ethercat slaves on bus need to put here, even unused.
[ethercat]
    # which indexed slave is drive?
    [ethercat.slave_0]
        ESI_file_path = "../tmp/VEINAR_VS600B4_Driver_NoSlot_18.xml"
        enable_dc     = false
        virtual       = false
        [ethercat.slave_0.pdo_0]
            "RxPDO_assign" = 0x1c12
            "RxPDO_map" = 0x1600
            "RxPDO_map_values" = [0x604000, 0x607a00, 0x60ff00]
            "TxPDO_assign" = 0x1c13
            "TxPDO_map" = 0x1A00
            "TxPDO_map_values" = [
                0x603f00,
                0x604100,
                0x606400,
                0x606C00,
                0x60f400,
            ]
        [ethercat.slave_0.pdo_1]
