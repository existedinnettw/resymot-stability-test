# mapping drive to ethercat device
[drives]
    [drives.1]
        ecat_order    = 0
        profile_order = 0
        [drives.1.webots]
    [drives.2]
        ecat_order    = 0
        profile_order = 1
    [drives.3]
        ecat_order    = 0
        profile_order = 2
    [drives.4]
        ecat_order    = 0
        profile_order = 3
    [drives.5]
        ecat_order    = 0
        profile_order = 4
    [drives.6]
        ecat_order    = 2
        profile_order = 0
[ios]
    [ios.1]
        ecat_order    = 1
        profile_order = 0

[engine_parameters]
    tick_period = 1e-3


[XYZ_axes]
    [XYZ_axes.1]
        [XYZ_axes.1.machine_parameter]
            # folowing values are dimensionless, just keep consitent across all program.
            error_bound      = 9.6e-3
            max_acceleration = 3.5
            max_jerk         = 24
            max_speed        = 1.0
        [XYZ_axes.1.kinematic]
            x_dir    = 1
            x_offset = 0
            y_dir    = 1
            y_offset = 0
            z_dir    = 1
            z_offset = 0
        [XYZ_axes.1.axis_x]
            [XYZ_axes.1.axis_x.pos_only]
                drive_order       = 1
                enc_offset        = -6
                ratio_denominator = 1310720
                ratio_numerator   = 1
        [XYZ_axes.1.axis_y]
            [XYZ_axes.1.axis_y.pos_only]
                drive_order       = 2
                enc_offset        = -4
                ratio_denominator = 1310720
                ratio_numerator   = 1
